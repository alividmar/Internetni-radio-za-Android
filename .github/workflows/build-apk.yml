name: Zgradi Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Sestavi APK paket
    runs-on: ubuntu-latest

    steps:
      - name: Prenos izvorne kode
        uses: actions/checkout@v4

      - name: Namestitev Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Namestitev Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Namestitev Android SDK
        uses: android-actions/setup-android@v3

      - name: Namestitev odvisnosti
        run: npm ci || npm install

      - name: Izgradnja spletne aplikacije
        run: npm run build

      - name: Namestitev Capacitor Android orodij
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Internetni Radio" "si.radio.internetni" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Izgradnja Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Shranitev APK datoteke za prenos
        uses: actions/upload-artifact@v4
        with:
          name: radio-slovenija-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
