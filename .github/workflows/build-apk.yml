name: Zgradi Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Sestavi APK paket
    runs-on: ubuntu-latest

    steps:
      - name: Prenos izvorne kode
        uses: actions/checkout@v4

      - name: Namestitev Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Namestitev Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Namestitev odvisnosti
        run: npm install --legacy-peer-deps

      - name: Izgradnja spletne aplikacije
        run: npm run build

      - name: Priprava Capacitor in Android okolja
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "Internetni Radio" "si.radio.internetni" --web-dir=dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Sprejem Android licenc
        run: yes | sdkmanager --licenses || true

      - name: Izgradnja Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Shranitev APK datoteke za prenos
        uses: actions/upload-artifact@v4
        with:
          name: radio-slovenija-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
